name: CI_build

on: [push, pull_request]

jobs:
  build:

    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        build_configuration: [Release, Debug]
        build_platform: [x64]

    steps:
    - name: Checkout repo
      uses: actions/checkout@v6

    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v3

    - name: Build of plugin dll
      run: .\build.ps1 -Configuration ${{ matrix.build_configuration }}

    - uses: olegtarasov/get-tag@v2.1.4
      id: tagName
      
    - name: zip artifacts for ${{ matrix.build_platform }}
      if: matrix.build_configuration == 'Release'
      run: 7z a BunyanLogViewer_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip .\build\${{ matrix.build_configuration }}\BunyanLogViewer.dll

    - name: Archive artifacts for ${{ matrix.build_platform }}
      if: matrix.build_configuration == 'Release'
      uses: actions/upload-artifact@v7
      with:
          name: BunyanLogViewer_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip
          path: BunyanLogViewer_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip

    - name: Create release on tagging
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/')
      with:
          files: BunyanLogViewer_${{ steps.tagName.outputs.tag }}_${{ matrix.build_platform }}.zip